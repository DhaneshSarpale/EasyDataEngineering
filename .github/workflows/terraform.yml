name: Terraform

# Validate + plan the infrastructure on PRs; apply on merge to main.
# Authentication uses GitHub OIDC (no long-lived AWS keys stored as
# secrets) - the workflow assumes a role whose trust policy is scoped to
# this repo (see infrastructure/iam/github_oidc_deploy_policy.json).
on:
  push:
    branches: [main]
    paths: ["infrastructure/**", "orchestration/step_functions/**"]
  pull_request:
    paths: ["infrastructure/**", "orchestration/step_functions/**"]

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"
      - name: Terraform fmt check
        run: terraform -chdir=infrastructure/terraform/dev fmt -check -recursive ..
      - name: Terraform init (no backend)
        run: terraform -chdir=infrastructure/terraform/dev init -backend=false
      - name: Terraform validate
        run: terraform -chdir=infrastructure/terraform/dev validate

  plan:
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::000000000000:role/dataforge-dev-deploy
          aws-region: eu-west-1
      - name: Terraform init
        run: terraform -chdir=infrastructure/terraform/dev init
      - name: Terraform plan
        run: terraform -chdir=infrastructure/terraform/dev plan -no-color

  # Apply only runs on merge to main, after a human-reviewed plan.
  apply:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production   # requires an approval in GitHub Environments
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::000000000000:role/dataforge-dev-deploy
          aws-region: eu-west-1
      - name: Terraform init
        run: terraform -chdir=infrastructure/terraform/dev init
      - name: Terraform apply
        run: terraform -chdir=infrastructure/terraform/dev apply -auto-approve
