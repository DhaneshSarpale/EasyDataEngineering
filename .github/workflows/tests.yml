name: Tests

# Unit + integration + data-quality tests across Python versions. No AWS
# credentials required - everything runs in LOCAL MODE against a temp
# SQLite source DB generated by the test fixtures.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (no Spark; fast)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,files,dev]"
      - name: Run test suite (excluding slow Spark tests)
        env:
          DATAFORGE_ENV: dev
        run: pytest -m "not spark" --cov=dataforge --cov-report=term-missing
