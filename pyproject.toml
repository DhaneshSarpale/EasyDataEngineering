[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataforge"
version = "0.1.0"
description = "DataForge - Production-style end-to-end AWS Data Engineering reference platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DataForge Contributors" }]
keywords = ["data-engineering", "aws", "etl", "elt", "pyspark", "glue", "portfolio"]

# Runtime deps are also listed in requirements.txt for pip-only workflows.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "Faker>=25.0",
    "PyYAML>=6.0",
    "requests>=2.32",
    "click>=8.1",
    "tabulate>=0.9",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
api = ["flask>=3.0"]
sftp = ["paramiko>=3.4"]
dq = ["great-expectations>=0.18"]
files = ["lxml>=5.2", "fastavro>=1.9"]
aws = ["boto3>=1.34"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
]

[project.scripts]
dataforge = "dataforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests that exercise multiple components / local services",
    "data_quality: data quality rule tests",
    "spark: tests requiring a local Spark session (slow)",
]
